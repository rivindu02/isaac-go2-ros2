defaults:
  - _self_

num_envs: 1
freq: 40 # can only be divisible by 200
camera_follow: True
camera_follow_offset: [-2.5, 0.0, 1.3]  # ~1.7m absolute camera height given robot root ~0.41m -- safe margin under a 2.4m ceiling
#env_name: obstacle-dense
env_name: full-warehouse
#env_name: office
dataset_path: "/home/ubuntu/isaac-go2-ros2/mesh.usd"

sensor:
  enable_lidar: True
  enable_camera: False
  enable_zed: True
  color_image: False
  depth_image: False
  semantic_segmentation: False

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: True